<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Emoji Clicker 2</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        @keyframes float-up {
            0% { transform: translateY(0) scale(1); opacity: 1; }
            100% { transform: translateY(-80px) scale(1.5); opacity: 0; }
        }
        .floating-emoji {
            position: absolute;
            pointer-events: none;
            animation: float-up 0.8s ease-out forwards;
            font-size: 1.5rem;
            font-weight: bold;
        }
        @keyframes pulse-pop {
            0% { transform: scale(1); }
            50% { transform: scale(0.92); }
            100% { transform: scale(1); }
        }
        .click-pop {
            animation: pulse-pop 0.1s ease-in-out;
        }

        .leaderboard-overlay {
            position: fixed;
            inset: 0;
            background: rgba(2, 6, 23, 0.82);
            backdrop-filter: blur(8px);
            display: none;
            align-items: center;
            justify-content: center;
            padding: 1rem;
            z-index: 100;
        }
        .leaderboard-overlay.open { display: flex; }
        .leaderboard-modal {
            width: min(720px, 100%);
            max-height: 90vh;
            overflow: auto;
            background: rgba(15, 23, 42, 0.98);
            border: 1px solid rgba(100, 116, 139, 0.45);
            border-radius: 1.5rem;
            box-shadow: 0 25px 80px rgba(0,0,0,.45);
        }
        .rank-row { display: grid; grid-template-columns: 64px 1fr auto; gap: 12px; align-items: center; }
        .rank-medal { font-size: 1.35rem; text-align: center; }
        .rank-me { outline: 2px solid rgba(251, 191, 36, 0.7); background: rgba(245, 158, 11, 0.10) !important; }
        .rank-loading { opacity: .75; }
        @media (max-width: 560px) { .rank-row { grid-template-columns: 45px 1fr auto; gap: 8px; } }

        @keyframes helper-orbit {
            0% { transform: rotate(0deg) translate(95px) rotate(0deg); }
            100% { transform: rotate(360deg) translate(95px) rotate(-360deg); }
        }
        .helper-element {
            position: absolute;
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.25rem;
            pointer-events: none;
            transition: transform 0.3s;
        }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col justify-between selection:bg-amber-500 selection:text-white">

    <header class="bg-slate-800/80 backdrop-blur border-b border-slate-700 p-4 shadow-lg sticky top-0 z-50">
        <div class="max-w-6xl mx-auto flex justify-between items-center">
            <h1 class="text-2xl md:text-3xl font-black tracking-wider bg-gradient-to-r from-amber-400 via-orange-500 to-red-500 bg-clip-text text-transparent">
                ✨ Emoji Clicker 2 ✨
            </h1>
            <div class="flex gap-4 text-xs md:text-sm font-semibold">
                <div class="bg-slate-700/60 px-3 py-1.5 rounded-xl border border-slate-600 flex items-center gap-1.5">
                    <span>⚡ CPS:</span> <span id="cps-display" class="text-amber-400 font-bold">0.0</span>
                </div>
                <div class="bg-slate-700/60 px-3 py-1.5 rounded-xl border border-slate-600 flex items-center gap-1.5">
                    <span>🏆 Total:</span> <span id="total-earned" class="text-emerald-400 font-bold">0</span>
                </div>
            </div>
        </div>
    </header>

    <main class="max-w-6xl w-full mx-auto p-4 md:p-6 grid grid-cols-1 lg:grid-cols-3 gap-6 flex-grow">
        
        <!-- Left Column: Clicker Stage -->
        <section class="lg:col-span-1 bg-slate-800/50 backdrop-blur border border-slate-700/80 rounded-3xl p-6 flex flex-col items-center justify-between shadow-xl relative overflow-hidden">
            <div class="absolute inset-0 bg-gradient-to-b from-amber-500/5 to-transparent pointer-events-none"></div>
            
            <div class="text-center z-10 w-full mb-4">
                <span id="current-badge" class="text-xs uppercase tracking-widest bg-amber-500/20 text-amber-300 border border-amber-500/30 px-3 py-1 rounded-full font-bold">Iniciante dos Emojis</span>
                <div class="text-4xl md:text-5xl font-black mt-3 text-amber-400 tracking-tight" id="score-display">0</div>
                <div class="text-xs text-slate-400 mt-1">emojis coletados</div>
            </div>

            <!-- Clickable Emoji Area with Helper Orbit Container -->
            <div class="relative my-8 z-10 flex items-center justify-center">
                <div id="helpers-orbit-container" class="absolute w-64 h-64 pointer-events-none flex items-center justify-center"></div>
                <button id="clicker-btn" class="w-44 h-44 md:w-52 md:h-52 bg-gradient-to-br from-amber-400 via-orange-500 to-yellow-600 rounded-full shadow-2xl flex items-center justify-center text-7xl md:text-8xl hover:scale-105 active:scale-95 transition-all duration-75 cursor-pointer select-none border-4 border-amber-300/40 shadow-orange-500/20">
                    <span id="main-emoji-icon" class="drop-shadow-lg">😀</span>
                </button>
            </div>

            <div class="w-full bg-slate-700/40 border border-slate-700 rounded-2xl p-3 z-10 text-center">
                <div class="text-xs text-slate-400 mb-1">Poder por Clique</div>
                <div id="click-power-display" class="text-lg font-bold text-amber-300">1</div>
            </div>
        </section>

        <!-- Middle & Right Columns: Upgrades & Store -->
        <section class="lg:col-span-2 grid grid-cols-1 md:grid-cols-2 gap-6">
            
            <!-- Upgrades Panel -->
            <div class="bg-slate-800/50 backdrop-blur border border-slate-700/80 rounded-3xl p-5 shadow-xl flex flex-col">
                <h2 class="text-lg font-bold text-slate-200 mb-4 flex items-center gap-2 border-b border-slate-700 pb-3">
                    <span>🚀</span> Ajudantes Automáticos
                </h2>
                <div id="upgrades-container" class="space-y-3 overflow-y-auto max-h-[420px] pr-1">
                    <!-- Dynamic Upgrades Loaded via JS -->
                </div>
            </div>

            <!-- Shop / Click Boosters Panel -->
            <div class="bg-slate-800/50 backdrop-blur border border-slate-700/80 rounded-3xl p-5 shadow-xl flex flex-col">
                <h2 class="text-lg font-bold text-slate-200 mb-4 flex items-center gap-2 border-b border-slate-700 pb-3">
                    <span>⚡</span> Melhorias de Clique
                </h2>
                <div id="boosters-container" class="space-y-3 overflow-y-auto max-h-[420px] pr-1">
                    <!-- Dynamic Boosters Loaded via JS -->
                </div>
            </div>

        </section>
    </main>

    <footer class="bg-slate-800/80 backdrop-blur border-t border-slate-700 py-3 px-6 text-center text-xs text-slate-400 flex flex-wrap justify-between items-center max-w-6xl mx-auto w-full gap-2 rounded-t-2xl">
        <div>Emoji Clicker 2 — Salva automaticamente no navegador 💾</div>
        <div class="flex gap-2">
            <button onclick="openLeaderboard()" class="bg-cyan-500/20 hover:bg-cyan-500/30 text-cyan-300 border border-cyan-500/30 px-3 py-1.5 rounded-xl font-semibold transition">🌎 Ranking Global</button>
            <button onclick="resetGame()" class="bg-red-500/20 hover:bg-red-500/30 text-red-300 border border-red-500/30 px-3 py-1.5 rounded-xl font-semibold transition">Reiniciar Jogo</button>
        </div>
    </footer>


    <!-- Global Leaderboard -->
    <div id="leaderboard-overlay" class="leaderboard-overlay" onclick="if(event.target===this) closeLeaderboard()">
        <div class="leaderboard-modal p-5 md:p-6">
            <div class="flex items-start justify-between gap-4 mb-5">
                <div>
                    <div class="text-xs uppercase tracking-widest text-cyan-300 font-bold">ONLINE</div>
                    <h2 class="text-2xl md:text-3xl font-black text-white">🌎 Ranking Global</h2>
                    <p class="text-sm text-slate-400 mt-1">Os maiores recordes de Emoji Clicker 2.</p>
                </div>
                <button onclick="closeLeaderboard()" class="text-slate-400 hover:text-white text-2xl leading-none" aria-label="Fechar">×</button>
            </div>

            <div class="grid sm:grid-cols-[1fr_auto] gap-3 mb-4">
                <input id="leaderboard-name" maxlength="20" placeholder="Seu nome no ranking" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-sm outline-none focus:border-cyan-400">
                <button id="save-rank-btn" onclick="publishLeaderboardScore()" class="bg-cyan-500 hover:bg-cyan-400 text-slate-950 font-black px-5 py-3 rounded-xl transition">🚀 Enviar recorde</button>
            </div>
            <div id="leaderboard-status" class="text-xs text-slate-400 mb-4"></div>
            <div id="leaderboard-list" class="space-y-2">
                <div class="rank-loading text-center py-10 text-slate-400">Carregando ranking...</div>
            </div>
            <div id="leaderboard-self" class="mt-4 text-sm text-center text-slate-400"></div>
        </div>
    </div>

    <script>
        // Game State Variables
        let score = 0;
        let totalEarned = 0;
        let clickPower = 1;
        let cps = 0;

        // Global leaderboard settings (Cloudflare Pages + D1)
        const LEADERBOARD_API = '/api/leaderboard';
        let playerId = localStorage.getItem('emoji_clicker_player_id');
        if (!playerId) {
            playerId = (crypto.randomUUID ? crypto.randomUUID() : 'p-' + Date.now() + '-' + Math.random().toString(36).slice(2));
            localStorage.setItem('emoji_clicker_player_id', playerId);
        }
        let leaderboardName = localStorage.getItem('emoji_clicker_player_name') || '';

        const emojisList = ['😀', '😎', '🥳', '🚀', '⭐', '🔥', '💎', '👑', '🌌', '🌟'];

        // Expanded Upgrades (Auto CPS generators with 1.25x scaling)
        const upgrades = [
            { id: 'cursor', name: 'Mãozinha Robô', emoji: '🤖', baseCost: 15, cost: 15, cps: 0.5, count: 0, costMultiplier: 1.25 },
            { id: 'monkey', name: 'Macaco DJ', emoji: '🐵', baseCost: 100, cost: 100, cps: 4, count: 0, costMultiplier: 1.25 },
            { id: 'robot', name: 'Andróide Fanático', emoji: '🦾', baseCost: 1100, cost: 1100, cps: 32, count: 0, costMultiplier: 1.25 },
            { id: 'alien', name: 'Nave Alienígena', emoji: '🛸', baseCost: 12000, cost: 12000, cps: 260, count: 0, costMultiplier: 1.25 },
            { id: 'wizard', name: 'Mago Cósmico', emoji: '🧙‍♂️', baseCost: 130000, cost: 130000, cps: 1400, count: 0, costMultiplier: 1.25 },
            { id: 'dragon', name: 'Dragão de Fogo', emoji: '🐉', baseCost: 1400000, cost: 1400000, cps: 7800, count: 0, costMultiplier: 1.25 },
            { id: 'galaxy', name: 'Portal Dimensional', emoji: '🌀', baseCost: 20000000, cost: 20000000, cps: 44000, count: 0, costMultiplier: 1.25 }
        ];

        // Expanded Click Boosters (with 1.25x scaling)
        const boosters = [
            { id: 'coffee', name: 'Café Energético', emoji: '☕', baseCost: 50, cost: 50, powerAdd: 1, count: 0, costMultiplier: 1.25 },
            { id: 'keyboard', name: 'Teclado Gamer', emoji: '⌨️', baseCost: 500, cost: 500, powerAdd: 5, count: 0, costMultiplier: 1.25 },
            { id: 'gloves', name: 'Luvas de Diamante', emoji: '🧤', baseCost: 5000, cost: 5000, powerAdd: 25, count: 0, costMultiplier: 1.25 },
            { id: 'laser', name: 'Laser Quântico', emoji: '⚡', baseCost: 50000, cost: 50000, powerAdd: 150, count: 0, costMultiplier: 1.25 },
            { id: 'gauntlet', name: 'Manopla Infinita', emoji: '🥊', baseCost: 450000, cost: 450000, powerAdd: 850, count: 0, costMultiplier: 1.25 },
            { id: 'ai', name: 'Neural Chip', emoji: '🧠', baseCost: 4000000, cost: 4000000, powerAdd: 5000, count: 0, costMultiplier: 1.25 }
        ];

        // DOM Elements
        const scoreDisplay = document.getElementById('score-display');
        const totalEarnedDisplay = document.getElementById('total-earned');
        const cpsDisplay = document.getElementById('cps-display');
        const clickPowerDisplay = document.getElementById('click-power-display');
        const clickerBtn = document.getElementById('clicker-btn');
        const mainEmojiIcon = document.getElementById('main-emoji-icon');
        const currentBadge = document.getElementById('current-badge');
        const upgradesContainer = document.getElementById('upgrades-container');
        const boostersContainer = document.getElementById('boosters-container');
        const helpersOrbitContainer = document.getElementById('helpers-orbit-container');

        function initGame() {
            loadGame();
            renderUpgrades();
            renderBoosters();
            updateUI();
            renderHelperVisuals();

            clickerBtn.addEventListener('click', (e) => {
                score += clickPower;
                totalEarned += clickPower;
                
                clickerBtn.classList.add('click-pop');
                setTimeout(() => clickerBtn.classList.remove('click-pop'), 100);

                createFloatingText(e.clientX, e.clientY, `+${clickPower}`);
                updateUI();
            });

            // Main game loop (10 times per second)
            setInterval(() => {
                if (cps > 0) {
                    let added = cps / 10;
                    score += added;
                    totalEarned += added;
                    updateUI();
                }
            }, 100);

            // Auto save loop every 10 seconds
            setInterval(() => {
                saveGame();
                publishLeaderboardScore(true);
            }, 15000);
        }

        function createFloatingText(x, y, text) {
            const el = document.createElement('div');
            el.className = 'floating-emoji text-amber-400 font-extrabold';
            el.innerText = text;
            
            const offsetX = (Math.random() - 0.5) * 40;
            el.style.left = `${x + offsetX}px`;
            el.style.top = `${y - 20}px`;
            
            document.body.appendChild(el);
            setTimeout(() => el.remove(), 800);
        }

        function renderHelperVisuals() {
            helpersOrbitContainer.innerHTML = '';
            let totalHelpers = upgrades.reduce((sum, up) => sum + Math.min(up.count, 15), 0); // Limita visualmente para não sobrecarregar
            if (totalHelpers === 0) return;

            let angleStep = (Math.PI * 2) / Math.max(totalHelpers, 1);
            let currentAngle = 0;

            upgrades.forEach(up => {
                let visualCount = Math.min(up.count, 15);
                for (let i = 0; i < visualCount; i++) {
                    const helper = document.createElement('div');
                    helper.className = 'helper-element';
                    helper.innerText = up.emoji;

                    // Posicionamento orbital trigonométrico inicial
                    let radius = 105;
                    let x = Math.cos(currentAngle) * radius;
                    let y = Math.sin(currentAngle) * radius;
                    
                    helper.style.transform = `translate(${x}px, ${y}px)`;
                    helpersOrbitContainer.appendChild(helper);

                    // Animação de clique simulado do ajudante periodicamente
                    setInterval(() => {
                        if (up.count > 0) {
                            helper.style.transform = `translate(${x * 0.8}px, ${y * 0.8}px) scale(1.3)`;
                            setTimeout(() => {
                                helper.style.transform = `translate(${x}px, ${y}px) scale(1)`;
                            }, 150);
                        }
                    }, 1500 + Math.random() * 2000);

                    currentAngle += angleStep;
                }
            });
        }

        function renderUpgrades() {
            upgradesContainer.innerHTML = '';
            upgrades.forEach((up, index) => {
                const card = document.createElement('div');
                card.className = "bg-slate-700/40 hover:bg-slate-700/70 border border-slate-600/60 rounded-2xl p-3.5 flex items-center justify-between transition group";
                card.innerHTML = `
                    <div class="flex items-center gap-3">
                        <div class="text-3xl bg-slate-800/80 p-2 rounded-xl border border-slate-600">${up.emoji}</div>
                        <div>
                            <div class="font-bold text-sm text-slate-100">${up.name}</div>
                            <div class="text-xs text-amber-400">+${up.cps} CPS <span class="text-slate-400 ml-1">(Qtd: ${up.count})</span></div>
                        </div>
                    </div>
                    <button onclick="buyUpgrade(${index})" id="up-btn-${index}" class="bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold px-4 py-2 rounded-xl text-xs transition shadow-md disabled:opacity-40 disabled:cursor-not-allowed">
                        ${Math.floor(up.cost)} ✨
                    </button>
                `;
                upgradesContainer.appendChild(card);
            });
        }

        function renderBoosters() {
            boostersContainer.innerHTML = '';
            boosters.forEach((booster, index) => {
                const card = document.createElement('div');
                card.className = "bg-slate-700/40 hover:bg-slate-700/70 border border-slate-600/60 rounded-2xl p-3.5 flex items-center justify-between transition group";
                card.innerHTML = `
                    <div class="flex items-center gap-3">
                        <div class="text-3xl bg-slate-800/80 p-2 rounded-xl border border-slate-600">${booster.emoji}</div>
                        <div>
                            <div class="font-bold text-sm text-slate-100">${booster.name}</div>
                            <div class="text-xs text-emerald-400">+${booster.powerAdd} Clique <span class="text-slate-400 ml-1">(Qtd: ${booster.count})</span></div>
                        </div>
                    </div>
                    <button onclick="buyBooster(${index})" id="bo-btn-${index}" class="bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-bold px-4 py-2 rounded-xl text-xs transition shadow-md disabled:opacity-40 disabled:cursor-not-allowed">
                        ${Math.floor(booster.cost)} ✨
                    </button>
                `;
                boostersContainer.appendChild(card);
            });
        }

        function buyUpgrade(index) {
            let up = upgrades[index];
            if (score >= up.cost) {
                score -= up.cost;
                up.count++;
                up.cost *= up.costMultiplier;
                recalculateCPS();
                renderUpgrades();
                renderHelperVisuals();
                updateUI();
            }
        }

        function buyBooster(index) {
            let booster = boosters[index];
            if (score >= booster.cost) {
                score -= booster.cost;
                clickPower += booster.powerAdd;
                booster.count++;
                booster.cost *= booster.costMultiplier;
                renderBoosters();
                updateUI();
            }
        }

        function recalculateCPS() {
            cps = upgrades.reduce((sum, up) => sum + (up.cps * up.count), 0);
        }

        function updateUI() {
            scoreDisplay.innerText = Math.floor(score).toLocaleString();
            totalEarnedDisplay.innerText = Math.floor(totalEarned).toLocaleString();
            cpsDisplay.innerText = cps.toFixed(1);
            clickPowerDisplay.innerText = clickPower.toLocaleString();

            if (totalEarned >= 50000000) {
                currentBadge.innerText = "Deus dos Emojis 🌌";
                mainEmojiIcon.innerText = "🌌";
            } else if (totalEarned >= 1000000) {
                currentBadge.innerText = "Rei do Multiverso 👑";
                mainEmojiIcon.innerText = "👑";
            } else if (totalEarned >= 50000) {
                currentBadge.innerText = "Mestre Supremo 🌟";
                mainEmojiIcon.innerText = "⭐";
            } else if (totalEarned >= 5000) {
                currentBadge.innerText = "Colecionador Elite 😎";
                mainEmojiIcon.innerText = "😎";
            } else {
                currentBadge.innerText = "Iniciante dos Emojis 😀";
                mainEmojiIcon.innerText = "😀";
            }

            upgrades.forEach((up, index) => {
                const btn = document.getElementById(`up-btn-${index}`);
                if (btn) btn.disabled = score < up.cost;
            });

            boosters.forEach((booster, index) => {
                const btn = document.getElementById(`bo-btn-${index}`);
                if (btn) btn.disabled = score < booster.cost;
            });
        }

        function saveGame() {
            const gameState = {
                score,
                totalEarned,
                clickPower,
                upgrades: upgrades.map(u => ({ count: u.count, cost: u.cost })),
                boosters: boosters.map(b => ({ count: b.count, cost: b.cost }))
            };
            localStorage.setItem('emoji_clicker_save_v2', JSON.stringify(gameState));
        }

        function loadGame() {
            const saved = localStorage.getItem('emoji_clicker_save_v2');
            if (saved) {
                try {
                    const data = JSON.parse(saved);
                    score = data.score || 0;
                    totalEarned = data.totalEarned || 0;
                    clickPower = data.clickPower || 1;
                    if (data.upgrades) {
                        data.upgrades.forEach((u, i) => {
                            if (upgrades[i]) {
                                upgrades[i].count = u.count;
                                upgrades[i].cost = u.cost;
                            }
                        });
                    }
                    if (data.boosters) {
                        data.boosters.forEach((b, i) => {
                            if (boosters[i]) {
                                boosters[i].count = b.count;
                                boosters[i].cost = b.cost;
                            }
                        });
                    }
                    recalculateCPS();
                } catch (e) {
                    console.error("Erro ao carregar o jogo:", e);
                }
            }
        }


        function openLeaderboard() {
            document.getElementById('leaderboard-overlay').classList.add('open');
            document.getElementById('leaderboard-name').value = leaderboardName;
            loadLeaderboard();
        }

        function closeLeaderboard() {
            document.getElementById('leaderboard-overlay').classList.remove('open');
        }

        function setLeaderboardStatus(message, error = false) {
            const el = document.getElementById('leaderboard-status');
            el.innerText = message;
            el.className = 'text-xs mb-4 ' + (error ? 'text-red-300' : 'text-slate-400');
        }

        function cleanLeaderboardName(value) {
            return String(value || '').replace(/[^\p{L}\p{N}_ .-]/gu, '').trim().slice(0, 20);
        }

        async function loadLeaderboard() {
            const list = document.getElementById('leaderboard-list');
            list.innerHTML = '<div class="rank-loading text-center py-10 text-slate-400">Carregando ranking...</div>';
            try {
                const res = await fetch(LEADERBOARD_API + '?limit=50', { cache: 'no-store' });
                if (!res.ok) throw new Error('HTTP ' + res.status);
                const data = await res.json();
                const rows = Array.isArray(data.rows) ? data.rows : [];
                if (!rows.length) {
                    list.innerHTML = '<div class="text-center py-10 text-slate-400">Ainda não há jogadores no ranking. Seja o primeiro!</div>';
                    return;
                }
                list.innerHTML = rows.map((row, index) => {
                    const position = index + 1;
                    const medal = position === 1 ? '🥇' : position === 2 ? '🥈' : position === 3 ? '🥉' : '#' + position;
                    const me = row.player_id === playerId ? ' rank-me' : '';
                    return `<div class="rank-row${me} bg-slate-800/70 border border-slate-700 rounded-xl px-3 py-3">
                        <div class="rank-medal font-black text-amber-300">${medal}</div>
                        <div class="min-w-0"><div class="font-bold text-white truncate">${escapeHtml(row.player_name)}</div><div class="text-xs text-slate-400">Recorde global</div></div>
                        <div class="font-black text-emerald-300">${Number(row.score || 0).toLocaleString()}</div>
                    </div>`;
                }).join('');

                const selfIndex = rows.findIndex(r => r.player_id === playerId);
                const self = document.getElementById('leaderboard-self');
                self.innerText = selfIndex >= 0 ? `Você está em #${selfIndex + 1} nesta página.` : '';
            } catch (error) {
                console.error(error);
                list.innerHTML = '<div class="text-center py-10 text-red-300">Não foi possível carregar o ranking. Publique o projeto no Cloudflare Pages e configure o D1.</div>';
            }
        }

        async function publishLeaderboardScore(silent = false) {
            const nameInput = document.getElementById('leaderboard-name');
            const inputName = nameInput ? cleanLeaderboardName(nameInput.value) : leaderboardName;
            leaderboardName = inputName || leaderboardName || ('Jogador-' + playerId.slice(0, 6));
            localStorage.setItem('emoji_clicker_player_name', leaderboardName);
            if (!silent) setLeaderboardStatus('Enviando seu recorde...');
            try {
                const res = await fetch(LEADERBOARD_API, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ player_id: playerId, player_name: leaderboardName, score: Math.floor(totalEarned) })
                });
                const data = await res.json().catch(() => ({}));
                if (!res.ok) throw new Error(data.error || ('HTTP ' + res.status));
                if (!silent) {
                    setLeaderboardStatus('✅ Recorde enviado!');
                    await loadLeaderboard();
                }
            } catch (error) {
                if (!silent) setLeaderboardStatus('Ranking ainda não configurado no servidor.', true);
                console.error('Ranking:', error);
            }
        }

        function escapeHtml(value) {
            return String(value ?? '').replace(/[&<>'"]/g, char => ({'&':'&amp;','<':'&lt;','>':'&gt;','\'':'&#39;','"':'&quot;'}[char]));
        }

        function resetGame() {
            if (confirm("Tem certeza que deseja apagar todo o progresso e reiniciar do zero?")) {
                localStorage.removeItem('emoji_clicker_save_v2');
                location.reload();
            }
        }

        window.onload = initGame;
    </script>
</body>
